version: "3.8"

services:
  db:
    image: postgres:15
    container_name: sea-fajportal
    environment:
      POSTGRES_DB: sea-fajportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"  # Changed to 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
